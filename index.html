<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek Chat</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a21;
    --panel-2: #1c222b;
    --line: #262d38;
    --text: #e6e9ef;
    --muted: #8b94a3;
    --brand: #4d6bfe;
    --brand-soft: rgba(77,107,254,.14);
    --user: #2a3a6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  header {
    height: 58px; flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 0 18px; border-bottom: 1px solid var(--line); background: #10141a;
  }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .3px; }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #4d6bfe, #7b96ff);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff;
  }
  .logo span { font-size: 15px; }
  .model-select {
    appearance: none; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 30px 6px 12px; font-size: 12.5px; cursor: pointer; outline: none;
  }
  .spacer { flex: 1; }
  .icon-btn {
    height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: #3a4453; background: var(--panel-2); }
  .key-dot { width: 7px; height: 7px; border-radius: 50%; background: #e5534b; }
  .key-dot.ok { background: #3fb950; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 26px 16px 10px; scroll-behavior: smooth; }
  .wrap { max-width: 820px; margin: 0 auto; }

  .msg { display: flex; gap: 12px; margin-bottom: 22px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .avatar {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 9px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 2px;
  }
  .avatar.ai { background: linear-gradient(135deg, #4d6bfe, #8296ff); }
  .avatar.me { background: #2f3743; color: #b9c2cf; }
  .body { flex: 1; min-width: 0; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .content {
    font-size: 14.5px; line-height: 1.75; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .content p { margin: 0 0 10px; }
  .content p:last-child { margin-bottom: 0; }
  .content h4, .content h5 { margin: 14px 0 8px; font-size: 15px; }
  .content ul { margin: 0 0 10px; padding-left: 20px; }
  .content li { margin: 3px 0; }
  .content strong { color: #fff; }
  .content code.ic {
    background: #232a35; padding: 1px 5px; border-radius: 5px; font-size: 12.5px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .code { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #10151c; }
  .code-head {
    display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
    background: #182029; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  .code-head button {
    background: none; border: none; color: var(--muted); font-size: 11.5px; cursor: pointer;
  }
  .code-head button:hover { color: var(--text); }
  .code pre { margin: 0; padding: 12px; overflow-x: auto; }
  .code code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.8px; line-height: 1.6; color: #cfd8e6; }

  .reasoning { margin-bottom: 10px; border: 1px dashed #33405a; border-radius: 10px; background: #131a25; overflow: hidden; }
  .reasoning-head {
    display: flex; align-items: center; gap: 7px; padding: 7px 11px; cursor: pointer;
    font-size: 12px; color: #8fa3d6; user-select: none;
  }
  .reasoning-head .chev { margin-left: auto; transition: .2s; }
  .reasoning.open .chev { transform: rotate(180deg); }
  .reasoning-body { display: none; padding: 4px 12px 11px; font-size: 13px; line-height: 1.7; color: #9fb0cd; white-space: pre-wrap; }
  .reasoning.open .reasoning-body { display: block; }
  .reasoning.done .reasoning-head { color: #6d7fa3; }

  .meta { margin-top: 6px; font-size: 11.5px; color: #626c7c; }
  .cursor {
    display: inline-block; width: 7px; height: 15px; background: var(--brand); border-radius: 2px;
    vertical-align: -2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .empty { text-align: center; padding: 70px 10px 30px; color: var(--muted); }
  .empty h1 { font-size: 22px; color: var(--text); font-weight: 600; margin: 0 0 10px; }
  .empty p { font-size: 13.5px; margin: 0 0 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 620px; margin: 0 auto; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; color: #b7c0cd; cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: var(--brand); color: #fff; background: var(--brand-soft); }

  footer { flex: 0 0 auto; padding: 10px 16px 16px; background: linear-gradient(180deg, transparent, #0e1116 40%); }
  .composer {
    max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 10px 8px; transition: border-color .15s;
  }
  .composer:focus-within { border-color: #3c4c78; box-shadow: 0 0 0 3px rgba(77,107,254,.08); }
  textarea {
    width: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text);
    font-size: 14.5px; line-height: 1.6; font-family: inherit; max-height: 190px; min-height: 46px; padding: 6px 8px;
  }
  textarea::placeholder { color: #5d6778; }
  .composer-bar { display: flex; align-items: center; gap: 10px; padding: 2px 4px 0; }
  .hint { font-size: 11.5px; color: #5d6778; }
  .send {
    margin-left: auto; height: 34px; min-width: 76px; border-radius: 9px; border: none; cursor: pointer;
    background: var(--brand); color: #fff; font-size: 13.5px; font-weight: 600; transition: .15s;
  }
  .send:hover { background: #3f5cf0; }
  .send:disabled { background: #2a3346; color: #75808f; cursor: not-allowed; }
  .send.stop { background: #3a2a2a; color: #f08c8c; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px);
    background: #2a1f22; border: 1px solid #5a3a3f; color: #f3b1b1; padding: 9px 16px; border-radius: 9px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; max-width: 80vw; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(6,8,12,.7); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 420px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px;
  }
  .modal h3 { margin: 0 0 6px; font-size: 16px; }
  .modal .desc { font-size: 12.5px; color: var(--muted); line-height: 1.65; margin: 0 0 14px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .modal input[type=password], .modal input[type=text] {
    width: 100%; height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); padding: 0 12px; font-size: 13px; outline: none; font-family: inherit;
  }
  .modal input:focus { border-color: #3c4c78; }
  .modal .row { display: flex; gap: 10px; margin-top: 18px; }
  .modal .btn {
    flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); cursor: pointer; font-size: 13px;
  }
  .modal .btn.primary { background: var(--brand); border-color: var(--brand); font-weight: 600; }
  .modal .tips { font-size: 11.5px; color: #6b7686; margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark">DS</div><span>DeepSeek Chat</span></div>
  <select class="model-select" id="modelSelect">
    <option value="deepseek-chat">DeepSeek-V3 · 通用对话</option>
    <option value="deepseek-reasoner">DeepSeek-R1 · 深度推理</option>
  </select>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnNew">＋ 新对话</button>
  <button class="icon-btn" id="btnExport">导出</button>
  <button class="icon-btn" id="btnSetting"><span class="key-dot" id="keyDot"></span> API Key</button>
</header>

<main id="scroller">
  <div class="wrap" id="list"></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
    <div class="composer-bar">
      <span class="hint" id="hint">模型：DeepSeek-V3</span>
      <button class="send" id="btnSend">发送</button>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <h3>设置 API Key</h3>
    <p class="desc">在 DeepSeek 开放平台创建 API Key，粘贴到这里即可。Key 只保存在本机浏览器，请求经本地服务转发。</p>
    <label>API Key（sk- 开头）</label>
    <input type="password" id="keyInput" placeholder="sk-..." autocomplete="off" spellcheck="false" />
    <label>温度 temperature：<span id="tempVal">1.0</span></label>
    <input type="range" id="tempInput" min="0" max="1.5" step="0.1" value="1" style="width:100%;margin-top:6px" />
    <div class="row">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSaveKey">保存</button>
    </div>
    <div class="tips">Base URL：https://api.deepseek.com　｜　模型：deepseek-chat（V3）、deepseek-reasoner（R1）</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const list = $('list');
const scroller = $('scroller');
const input = $('input');
const btnSend = $('btnSend');
const STORE_KEY = 'ds_api_key';
const STORE_HISTORY = 'ds_history';

const state = {
  key: localStorage.getItem(STORE_KEY) || '',
  model: 'deepseek-chat',
  temperature: 1.0,
  messages: [],      // {role, content}
  streaming: false,
  controller: null,
};

/* ---------------- 工具 ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function toast(msg, ms = 3200) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}
function scrollBottom(force) {
  const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
  if (force || nearBottom || state.streaming) scroller.scrollTop = scroller.scrollHeight;
}
function refreshKeyDot() { $('keyDot').classList.toggle('ok', !!state.key); }

/* ---------------- 轻量 Markdown ---------------- */
function mdInline(text) {
  if (!text) return '';
  let s = escapeHtml(text);
  s = s.replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  return s;
}
function mdBlock(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let out = '', para = [], inList = false;
  const flushPara = () => {
    if (para.length) {
      out += '<p>' + para.map(mdInline).join('<br>') + '</p>';
      para = [];
    }
  };
  const closeList = () => { if (inList) { out += '</ul>'; inList = false; } };
  for (const line of lines) {
    const h = line.match(/^(#{1,4})\s+(.+)$/);
    if (h) { flushPara(); closeList(); out += '<h4>' + mdInline(h[2]) + '</h4>'; continue; }
    const li = line.match(/^\s*(?:[-*·])\s+(.+)$/);
    if (li) { flushPara(); if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + mdInline(li[1]) + '</li>'; continue; }
    if (!line.trim()) { flushPara(); closeList(); continue; }
    closeList();
    para.push(line);
  }
  flushPara(); closeList();
  return out;
}
function mdToHtml(text) {
  if (!text) return '';
  let html = '', idx = 0;
  const fence = /```([^\n]*)\n?([\s\S]*?)(```|$)/g;
  let m;
  while ((m = fence.exec(text)) !== null) {
    html += mdBlock(text.slice(idx, m.index));
    const lang = (m[1] || '').trim() || 'code';
    html += '<div class="code"><div class="code-head"><span>' + escapeHtml(lang) +
            '</span><button class="cp">复制</button></div><pre><code>' + escapeHtml(m[2]) + '</code></pre></div>';
    idx = m.index + m[0].length;
    if (!m[3]) break;
    if (m.index === fence.lastIndex) fence.lastIndex++;
  }
  html += mdBlock(text.slice(idx));
  return html;
}

/* ---------------- 渲染消息 ---------------- */
function createMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const isUser = role === 'user';
  el.innerHTML =
    '<div class="avatar ' + (isUser ? 'me">我' : 'ai">DS') + '</div>' +
    '<div class="body"><div class="who">' + (isUser ? '你' : 'DeepSeek') + '</div>' +
    (isUser ? '' : '<div class="reasoning" style="display:none"><div class="reasoning-head">💡 深度思考<span class="chev">▾</span></div><div class="reasoning-body"></div></div>') +
    '<div class="content"></div><div class="meta"></div></div>';
  el.querySelector('.content').innerHTML = isUser ? '<p>' + escapeHtml(text).replace(/\n/g, '<br>') + '</p>' : '';
  return el;
}

function renderAll() {
  list.innerHTML = '';
  if (!state.messages.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML =
      '<h1>你好，我是 DeepSeek</h1><p>由本地服务直连 DeepSeek 官方接口，支持流式输出与深度思考</p>' +
      '<div class="chips">' +
      ['用三句话解释什么是大语言模型', '帮我写一个 Python 快速排序', '给产品经理写一份周报模板', '如何系统学习机器学习？']
        .map(t => '<div class="chip" data-q="' + escapeHtml(t) + '">' + escapeHtml(t) + '</div>').join('') +
      '</div>';
    list.appendChild(empty);
    empty.querySelectorAll('.chip').forEach(c => c.onclick = () => {
      input.value = c.dataset.q; autoGrow(); input.focus();
    });
    return;
  }
  const wrapFrag = document.createDocumentFragment();
  for (const msg of state.messages) {
    const el = createMsg(msg.role, msg.content);
    const contentEl = el.querySelector('.content');
    contentEl.innerHTML = msg.role === 'user'
      ? '<p>' + escapeHtml(msg.content).replace(/\n/g, '<br>') + '</p>'
      : mdToHtml(msg.content);
    if (msg.reasoning) {
      const box = el.querySelector('.reasoning');
      if (box) {
        box.style.display = '';
        box.querySelector('.reasoning-body').textContent = msg.reasoning;
      }
    }
    if (msg.usage) el.querySelector('.meta').textContent = fmtUsage(msg.usage);
    wrapFrag.appendChild(el);
  }
  list.appendChild(wrapFrag);
  scrollBottom(true);
}

function fmtUsage(u) {
  if (!u) return '';
  const t = u.total_tokens || 0, p = u.prompt_tokens || 0, c = u.completion_tokens || 0;
  if (!t) return '';
  return 'tokens：输入 ' + p + ' · 输出 ' + c + ' · 合计 ' + t;
}

/* ---------------- 发送 ---------------- */
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 190) + 'px';
}

async function send() {
  if (state.streaming) return;
  const text = input.value.trim();
  if (!text) return;
  if (!state.key) { openModal(); toast('请先设置 API Key'); return; }

  if (!state.messages.length) list.innerHTML = '';
  state.messages.push({ role: 'user', content: text });
  const userEl = createMsg('user', text);
  list.appendChild(userEl);
  input.value = ''; autoGrow(); scrollBottom(true);

  // assistant 占位
  const aiEl = createMsg('assistant', '');
  const contentEl = aiEl.querySelector('.content');
  const metaEl = aiEl.querySelector('.meta');
  const reasonBox = aiEl.querySelector('.reasoning');
  const reasonBody = aiEl.querySelector('.reasoning-body');
  contentEl.innerHTML = '<span class="cursor"></span>';
  list.appendChild(aiEl);

  const msgObj = { role: 'assistant', content: '', reasoning: '' };
  state.messages.push(msgObj);

  state.streaming = true;
  state.controller = new AbortController();
  btnSend.textContent = '停止';
  btnSend.classList.add('stop');
  scrollBottom(true);

  let frame = null;
  const paint = () => {
    frame = null;
    contentEl.innerHTML = mdToHtml(msgObj.content) + (state.streaming ? '<span class="cursor"></span>' : '');
    scrollBottom();
  };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(paint); };

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': state.key },
      body: JSON.stringify({
        model: state.model,
        temperature: state.temperature,
        messages: state.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
      }),
      signal: state.controller.signal,
    });

    if (!resp.ok) {
      let em = 'HTTP ' + resp.status;
      try { const j = await resp.json(); em = j.error || em; } catch (e) {}
      throw new Error(em);
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        let j;
        try { j = JSON.parse(data); } catch (e) { continue; }
        if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
        const delta = j.choices && j.choices[0] && j.choices[0].delta;
        if (delta) {
          if (delta.reasoning_content) {
            msgObj.reasoning += delta.reasoning_content;
            reasonBox.style.display = '';
            reasonBody.textContent = msgObj.reasoning;
            scrollBottom();
          }
          if (delta.content) {
            msgObj.content += delta.content;
            schedule();
          }
        }
        if (j.usage) {
          msgObj.usage = j.usage;
          metaEl.textContent = fmtUsage(j.usage);
        }
      }
      if (metaEl.textContent) scrollBottom();
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      msgObj.content += (msgObj.content ? '\n\n' : '') + '_（已停止生成）_';
    } else {
      if (!msgObj.content) {
        aiEl.remove();
        state.messages.pop();
        if (state.messages.length && state.messages[state.messages.length - 1].role === 'user') {
          state.messages.pop();
          userEl.remove();
        }
      } else {
        msgObj.content += '\n\n> 生成中断：' + err.message;
      }
      toast(err.message, 5000);
    }
  } finally {
    state.streaming = false;
    state.controller = null;
    btnSend.textContent = '发送';
    btnSend.classList.remove('stop');
    if (reasonBox.style.display !== 'none') reasonBox.classList.add('done', 'open');
    if (frame) cancelAnimationFrame(frame);
    paint();
    saveHistory();
  }
}

/* ---------------- 持久化 ---------------- */
function saveHistory() {
  try {
    localStorage.setItem(STORE_HISTORY, JSON.stringify({
      model: state.model, messages: state.messages.slice(-60)
    }));
  } catch (e) {}
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORE_HISTORY);
    if (!raw) return;
    const h = JSON.parse(raw);
    if (h && Array.isArray(h.messages) && h.messages.length) {
      state.messages = h.messages;
      if (h.model) { state.model = h.model; $('modelSelect').value = h.model; }
      syncHint();
      renderAll();
    }
  } catch (e) {}
}

/* ---------------- 事件绑定 ---------------- */
function syncHint() {
  $('hint').textContent = '模型：' + (state.model === 'deepseek-reasoner' ? 'DeepSeek-R1' : 'DeepSeek-V3');
}
function openModal() {
  $('keyInput').value = state.key;
  $('tempInput').value = state.temperature;
  $('tempVal').textContent = state.temperature.toFixed(1);
  $('modal').classList.add('show');
  setTimeout(() => $('keyInput').focus(), 50);
}

btnSend.onclick = () => {
  if (state.streaming) { state.controller && state.controller.abort(); return; }
  send();
};
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
input.addEventListener('input', autoGrow);

$('modelSelect').onchange = (e) => {
  state.model = e.target.value;
  syncHint();
  saveHistory();
};
$('btnNew').onclick = () => {
  if (state.streaming) return;
  state.messages = [];
  list.innerHTML = '';
  localStorage.removeItem(STORE_HISTORY);
  renderAll();
  toast('已开始新对话', 1500);
};
$('btnExport').onclick = () => {
  if (!state.messages.length) { toast('当前对话为空'); return; }
  const md = state.messages.map(m =>
    (m.role === 'user' ? '## 你\n\n' : '## DeepSeek\n\n') + (m.reasoning ? '> 思考过程\n> ' + m.reasoning.replace(/\n/g, '\n> ') + '\n\n' : '') + m.content
  ).join('\n\n---\n\n');
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0')
    + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = 'deepseek-chat-' + stamp + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('已导出 Markdown 文件', 1800);
};
$('btnSetting').onclick = openModal;
$('btnCancel').onclick = () => $('modal').classList.remove('show');
$('btnSaveKey').onclick = () => {
  const v = $('keyInput').value.trim();
  state.key = v;
  if (v) localStorage.setItem(STORE_KEY, v); else localStorage.removeItem(STORE_KEY);
  state.temperature = parseFloat($('tempInput').value) || 1.0;
  refreshKeyDot();
  $('modal').classList.remove('show');
  toast(v ? '设置已保存' : '已清空 API Key', 1800);
};
$('tempInput').oninput = (e) => { $('tempVal').textContent = parseFloat(e.target.value).toFixed(1); };
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.remove('show'); });

// 代码复制 + 思考区折叠（事件委托）
list.addEventListener('click', (e) => {
  const cp = e.target.closest('.cp');
  if (cp) {
    const pre = cp.closest('.code').querySelector('pre code');
    navigator.clipboard.writeText(pre.textContent).then(() => toast('已复制', 1200));
    return;
  }
  const rh = e.target.closest('.reasoning-head');
  if (rh) rh.parentElement.classList.toggle('open');
});

/* ---------------- 初始化 ---------------- */
refreshKeyDot();
syncHint();
loadHistory();
autoGrow();
input.focus();
fetch('/api/health').then(r => r.json()).then(h => {
  if (h.has_key && !state.key) {
    $('keyDot').classList.add('ok');
  }
}).catch(() => {});

// 新消息时若滚到底部
scroller.addEventListener('scroll', () => {});
</script>
</body>
</html>
